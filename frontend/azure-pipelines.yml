trigger:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"
  - script: npm ci
    workingDirectory: frontend
    displayName: "npm ci"
  - script: npx tsc -b --noEmit
    workingDirectory: frontend
    displayName: "type-check"
  - script: npm run build
    workingDirectory: frontend
    displayName: "npm run build"
