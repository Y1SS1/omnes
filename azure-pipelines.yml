trigger:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

stages:
  - stage: Backend
    displayName: "Backend Build, Quality & Security"
    jobs:
      - job: BuildBackend
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: "sdk"
              version: "8.x"

          - script: |
              dotnet tool install --global dotnet-sonarscanner
              dotnet tool install --global dotnet-reportgenerator-globaltool
              echo "##vso[task.prependpath]$HOME/.dotnet/tools"
            displayName: "Install CLI tools (SonarScanner & ReportGenerator)"

          - script: dotnet restore backend/TaskFlow.sln
            displayName: "dotnet restore"

          - script: >
              dotnet sonarscanner begin
              /k:"Omnes_Back"
              /o:"y1ss1"
              /d:sonar.token="$(SONAR_TOKEN)"
              /d:sonar.host.url="https://sonarcloud.io"
              /d:sonar.exclusions="**/Migrations/**"
              /d:sonar.cs.opencover.reportsPaths="$(Agent.TempDirectory)/coverage/**/coverage.opencover.xml"
            displayName: "SonarScanner begin"

          - script: dotnet build backend/TaskFlow.sln --no-restore --configuration Release
            displayName: "dotnet build"

          - script: >
              dotnet test backend/TaskFlow.Api.Tests --no-build --configuration Release
              --collect:"XPlat Code Coverage;Format=opencover,cobertura"
              --results-directory $(Agent.TempDirectory)/coverage
            displayName: "dotnet test + coverage"

          - script: dotnet sonarscanner end /d:sonar.token="$(SONAR_TOKEN)"
            displayName: "SonarScanner end"

          - script: |
              reportgenerator \
                -reports:"$(Agent.TempDirectory)/coverage/**/coverage.cobertura.xml" \
                -targetdir:"$(Build.SourcesDirectory)/CoverageReport" \
                -reporttypes:"HtmlInline_AzurePipelines;Cobertura" \
                -classfilters:"-*Migrations*"
            displayName: "Generate coverage report"

          - task: PublishCodeCoverageResults@2
            inputs:
              summaryFileLocation: "$(Build.SourcesDirectory)/CoverageReport/Cobertura.xml"
              pathToSources: "$(Build.SourcesDirectory)/backend/TaskFlow.Api"
            displayName: "Publish coverage report"

          - script: |
              # The container's user must be able to write the report into the mounted folder.
              chmod a+w $(Build.SourcesDirectory)
              docker run --rm -v $(Build.SourcesDirectory):/zap/wrk/:rw \
                -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
                -t https://omnes-api-vyissim.azurewebsites.net \
                -r zap-report.html -I || true
            displayName: "Run OWASP ZAP Baseline Security Scan"

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "$(Build.SourcesDirectory)/zap-report.html"
              artifact: "ZAPSecurityReport"
              publishLocation: "pipeline"
            condition: always()
            displayName: "Publish OWASP ZAP Security report"

  - stage: Frontend
    displayName: "Frontend Build & Quality"
    dependsOn: []
    jobs:
      - job: BuildFrontend
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "20.x"

          - script: npm ci
            workingDirectory: frontend/frontend
            displayName: "npm ci"

          - script: npx tsc -b --noEmit
            workingDirectory: frontend/frontend
            displayName: "type-check"

          - script: npm run build
            workingDirectory: frontend/frontend
            displayName: "npm run build"

          - script: npx -y @lhci/cli collect --staticDistDir=dist --numberOfRuns=1
            workingDirectory: frontend/frontend
            displayName: "Run Lighthouse audit"

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "frontend/frontend/.lighthouseci"
              artifact: "LighthouseReport"
              publishLocation: "pipeline"
            displayName: "Publish Lighthouse report"
